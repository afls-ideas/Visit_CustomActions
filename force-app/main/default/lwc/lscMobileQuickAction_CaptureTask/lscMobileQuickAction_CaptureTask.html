<template>
    <div class="slds-p-around_medium">
        <div class="slds-box slds-box_xx-small slds-theme_shade slds-m-bottom_small">
            Launched from: <b>{contextObject}</b> &mdash; Record Id: <b>{contextRecordId}</b>
        </div>
        <template lwc:if={errorMessage}>
            <div class="slds-text-color_error slds-m-bottom_small" role="alert">{errorMessage}</div>
        </template>
        <lightning-input label="Subject" name="subject" required value={subject}
            onchange={handleChange}></lightning-input>
        <lightning-input type="date" label="Due Date" name="dueDate" value={dueDate}
            onchange={handleChange}></lightning-input>
        <lightning-combobox label="Status" name="status" options={statusOptions} value={status}
            onchange={handleChange}></lightning-combobox>
        <lightning-combobox label="Priority" name="priority" options={priorityOptions} value={priority}
            onchange={handleChange}></lightning-combobox>
        <lightning-textarea label="Comments" name="description" value={description}
            onchange={handleChange}></lightning-textarea>
        <div class="slds-m-top_medium slds-grid slds-grid_align-end">
            <lightning-button label="Cancel" onclick={handleCancel} class="slds-m-right_small"></lightning-button>
            <lightning-button variant="brand" label="Save" onclick={handleSave} disabled={isSaving}></lightning-button>
        </div>
    </div>
</template>
